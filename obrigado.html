<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perifa Mídia | Obrigado</title>
    <meta name="description" content="Recebemos seu cadastro. Em breve entraremos em contato.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="canonical" href="https://perifamidia.com.br/obrigado">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >
    <style>
      :root {
        --bg: #0d0d0d;
        --text: #f6f2eb;
        --muted: rgba(246, 242, 235, 0.78);
        --accent: #e46ea3;
        --accent-strong: #f28bb6;
        --line: rgba(255, 255, 255, 0.14);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center;
      }
      .card { max-width: 560px; }
      .eyebrow {
        font-size: 0.85rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--accent-strong);
        margin: 0 0 18px;
        font-weight: 700;
      }
      h1 {
        font-family: "Anton", "Inter", sans-serif;
        font-weight: 400;
        font-size: clamp(2.4rem, 7vw, 3.6rem);
        line-height: 1.02;
        letter-spacing: 0.01em;
        margin: 0 0 18px;
        text-transform: uppercase;
      }
      p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; margin: 0 auto 28px; max-width: 46ch; }
      .btn {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 999px;
        background: var(--accent);
        color: #0d0d0d;
        font-weight: 700;
        text-decoration: none;
        border: 1px solid var(--accent);
        transition: background .2s ease, transform .2s ease;
      }
      .btn:hover { background: var(--accent-strong); transform: translateY(-1px); }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Perifa Mídia</p>
      <h1>Recebemos seu cadastro</h1>
      <p>Obrigado por se juntar a nós. Em breve entraremos em contato para acompanhar de perto a construção da maior infraestrutura de mídia e bem-estar periférico do país.</p>
      <a class="btn" href="./">Voltar ao início</a>
    </main>
  </body>
</html>
