<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Inter',-apple-system,Arial,sans-serif;background:#0E0A1A;color:#fff;min-height:100vh;display:grid;place-items:center;padding:24px;
 background:radial-gradient(1200px 700px at 70% -10%,rgba(15,77,184,.30),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(122,68,240,.20),transparent 55%),#0E0A1A}
.card{width:100%;max-width:430px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:44px 38px;text-align:center;backdrop-filter:blur(10px);box-shadow:0 40px 90px rgba(0,0,0,.45)}
.logo{font-family:'Sora';font-weight:800;font-size:16px;letter-spacing:.02em}.logo b{color:#7A44F0}
.kick{font-family:'Sora';font-weight:700;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:8px}
.lock{width:56px;height:56px;border-radius:16px;margin:30px auto 22px;display:grid;place-items:center;font-size:24px;background:linear-gradient(150deg,#1261D7,#0F4DB8);box-shadow:0 12px 30px rgba(15,77,184,.4)}
h1{font-family:'Sora';font-weight:800;font-size:26px;margin:0 0 10px;letter-spacing:-.02em}
p{font-size:14px;color:rgba(255,255,255,.62);margin:0 0 26px;line-height:1.5}
input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:15px 16px;color:#fff;font-size:15px;font-family:'Inter';outline:none;transition:.2s}
input:focus{border-color:#1261D7;background:rgba(15,77,184,.10)}
button{width:100%;margin-top:12px;background:#0F4DB8;color:#fff;border:0;border-radius:12px;padding:15px;font-family:'Sora';font-weight:800;font-size:15px;cursor:pointer;transition:.2s}
button:hover{background:#1261D7}button:disabled{opacity:.6;cursor:default}
.err{min-height:20px;margin-top:14px;font-size:13px;font-weight:600;color:#ff6b8a}
.foot{margin-top:26px;font-size:11px;letter-spacing:.06em;color:rgba(255,255,255,.35)}
</style></head>

<script>
(function(){
  var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),btn=document.getElementById('btn');
  function toBytes(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
  async function unlock(p){
    var raw=toBytes(window.__P);
    var salt=raw.slice(0,16),iv=raw.slice(16,28),tag=raw.slice(28,44),ct=raw.slice(44);
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:window.__IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var data=new Uint8Array(ct.length+tag.length);data.set(ct,0);data.set(tag,ct.length);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data);
    return new TextDecoder().decode(buf);
  }
  async function go(p,silent){
    if(!p)return; if(btn){btn.disabled=true;btn.textContent='Abrindo…';}
    try{ var html=await unlock(p); try{sessionStorage.setItem('timok',p);}catch(e){}
      document.open();document.write(html);document.close();
    }catch(e){ try{sessionStorage.removeItem('timok');}catch(_){}
      if(!silent){err.textContent='Senha incorreta. Tente novamente.';pw.value='';pw.focus();}
      if(btn){btn.disabled=false;btn.textContent='Acessar proposta';}
    }
  }
  f.addEventListener('submit',function(e){e.preventDefault();err.textContent='';go(pw.value,false);});
  try{var s=sessionStorage.getItem('timok');if(s){go(s,true);}}catch(e){}
})();
</script></body></html>
